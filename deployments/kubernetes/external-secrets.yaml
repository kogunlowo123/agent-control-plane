# Syncs control-plane secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (database URL) and the
# names the startup runbook uses for signing keys and the fabric client.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-control-plane-database
  namespace: agent-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-control-plane-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: agent-control-plane-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-control-plane-signing-keys
  namespace: agent-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-control-plane-signing-keys
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agent-control-plane-(audit|bundle)-key-"
      rewrite:
        - regexp:
            source: "^agent-control-plane-(audit|bundle)-key-(.*)$"
            target: "$1-$2.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-control-plane-fabric-client
  namespace: agent-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-control-plane-fabric-client
    creationPolicy: Owner
  data:
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: agent-control-plane-fabric-client-secret
