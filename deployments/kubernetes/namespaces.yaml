# Namespace of the control plane (and identity fabric) with restricted Pod
# Security and a default-deny NetworkPolicy; the chart's own NetworkPolicy
# then opens exactly what the control plane needs.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
  labels:
    agent-platform/member: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
