replicaCount: 2

image:
  repository: ghcr.io/kogunlowo123/agent-control-plane
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: agent-control-plane
  # Cloud workload identity bindings, e.g.
  #   eks.amazonaws.com/role-arn (AWS IRSA)
  #   azure.workload.identity/client-id (Azure Workload ID)
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
controlPlane:
  environment: production
  publicUrl: ""  # REQUIRED: public HTTPS URL of this control plane
  platformNamespace: agent-platform
  # REQUIRED: namespaces agents may be deployed into. The chart grants the
  # control plane write access to agent workload objects in these only.
  managedNamespaces: []
  reconcileIntervalSeconds: 30
  leaseTtlSeconds: 45
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint
  operator:
    issuer: ""  # REQUIRED: enterprise OIDC issuer
    audience: ""  # REQUIRED: audience operators' tokens carry
    jwksUrl: ""  # REQUIRED: JWKS URL of the enterprise OIDC issuer
    rolesClaim: roles
  # Integration with agent-identity-fabric. When disabled, agents calling the
  # MCP/A2A/runtime endpoints are authorized by local policy on IdP roles.
  fabric:
    enabled: false
    url: ""  # required when enabled
    trustDomain: ""  # required when enabled
    workloadAudience: identity-fabric
    clusterOidcIssuer: ""  # required when enabled: this cluster's OIDC issuer URL
    adminTokenUrl: ""  # required when enabled: IdP token endpoint (client credentials)
    adminClientId: ""  # required when enabled
    adminScope: identity-fabric-admin/.default

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: agent-control-plane-database
  # Secret holding the Ed25519 audit and policy-bundle signing keys (PEM).
  signingKeys: agent-control-plane-signing-keys
  auditKeyFile: ""  # REQUIRED: file name of the audit key in secrets.signingKeys
  bundleKeyFile: ""  # REQUIRED: file name of the bundle key in secrets.signingKeys
  # Secret holding key CLIENT_SECRET for the identity-fabric admin client.
  fabricClient: agent-control-plane-fabric-client

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: agent-control-plane-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
  # Namespaces whose pods may call the control plane (agents, gateways, CI).
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
