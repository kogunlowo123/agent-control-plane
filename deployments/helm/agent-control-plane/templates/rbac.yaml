{{- /*
Least privilege: the control plane manages exactly four kinds of objects
(ServiceAccount, ConfigMap, NetworkPolicy, Deployment), with get/create/
update/delete only (no list/watch, no pods, no secrets, no RBAC objects),
and only in the namespaces listed in controlPlane.managedNamespaces.
*/ -}}
{{- range .Values.controlPlane.managedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "acp.fullname" $ }}-agent-workloads
  namespace: {{ . }}
  labels: {{- include "acp.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "acp.fullname" $ }}-agent-workloads
  namespace: {{ . }}
  labels: {{- include "acp.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "acp.fullname" $ }}-agent-workloads
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
